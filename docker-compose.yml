# AI2THOR Task Planner - Docker Compose Configuration
# Simplifies X11 forwarding setup for running the simulator with display output

services:
  # CPU version
  ai2thor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai2thor-task-planner:cpu
    container_name: ai2thor-planner
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      # X11 socket for display forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Optional: Mount local directories for persistence
      - ./images:/app/images
      - ./pddl/outputs:/app/pddl/outputs
      - ./pddl/problems:/app/pddl/problems
      - ./Results:/app/Results
    network_mode: host

  # GPU version (requires nvidia-docker runtime)
  ai2thor-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: ai2thor-task-planner:gpu
    container_name: ai2thor-planner-gpu
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
    volumes:
      # X11 socket for display forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Optional: Mount local directories for persistence
      - ./images:/app/images
      - ./pddl/outputs:/app/pddl/outputs
      - ./pddl/problems:/app/pddl/problems
      - ./Results:/app/Results
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # OGAMUS mode with PDDL input file
  ai2thor-ogamus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai2thor-task-planner:cpu
    container_name: ai2thor-ogamus
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./images:/app/images
      - ./pddl/outputs:/app/pddl/outputs
      - ./pddl/problems:/app/pddl/problems
      - ./pddl/inputs:/app/pddl/inputs
      - ./Results:/app/Results
    network_mode: host
    command: ["python", "main.py", "./pddl/inputs/example.pddl"]
